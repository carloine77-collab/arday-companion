<script>
document.body.classList.toggle("standalone",window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true);
if("serviceWorker" in navigator){
 let hasControlledPage=!!navigator.serviceWorker.controller,reloadingForUpdate=false,activeRegistration=null;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{
  if(!hasControlledPage){hasControlledPage=true;return}
  if(reloadingForUpdate)return;
  reloadingForUpdate=true;
  window.location.reload();
 });
 const checkForAppUpdate=()=>{
  if(document.visibilityState!=="visible"||!activeRegistration)return;
  activeRegistration.update().catch(error=>console.warn("Arday update check failed:",error));
 };
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./service-worker.js",{scope:"./",updateViaCache:"none"}).then(registration=>{
   activeRegistration=registration;
   checkForAppUpdate();
   window.addEventListener("pageshow",checkForAppUpdate);
   document.addEventListener("visibilitychange",checkForAppUpdate);
   window.setInterval(checkForAppUpdate,15*60*1000);
   if(registration.waiting&&navigator.serviceWorker.controller)registration.waiting.postMessage({type:"SKIP_WAITING"});
  }).catch(error=>console.warn("Offline support unavailable:",error));
 });
}
</script>
