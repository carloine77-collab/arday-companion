<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2e7d4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arday">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Arday">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./assets/icons/arday-icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arday">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Arday">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./assets/icons/arday-icon.svg">
<title>Arday · 阿尔</title>
<link rel="stylesheet" href="assets/css/game.css?v=20261120t">
</head>
<body>
<div class="app">
<header class="top">
 <div class="identity-line">
  <button class="identity" id="profileEntry" aria-label="打开人物档案"><div class="mark">A</div><div class="identity-copy"><div class="name">Arday · 阿尔</div><div class="date" id="date">—</div></div></button>
  <div class="identity-meta"><span id="cash">共同账户 ¥30000</span></div>
 </div>
 <form class="chat" id="chatForm"><input id="message" maxlength="160" placeholder="和阿尔说点什么……" autocomplete="off"><button class="send">发送</button></form>
</header>
<div class="play-area">
<aside class="stats" aria-label="角色状态"><div class="stat-group"><div class="stat-group-title">情感</div>
  <div class="stat relation"><label>友谊</label><b id="friendV">24</b><div class="meter"><i id="friendB" style="width:24%"></i></div></div>
  <div class="stat relation"><label>依恋</label><b id="attachV">12</b><div class="meter"><i id="attachB" style="width:12%"></i></div></div>
  <div class="stat relation"><label>厌倦</label><b id="boredV">4</b><div class="meter"><i id="boredB" style="width:4%"></i></div></div>
  <div class="stat relation"><label>恨意</label><b id="hateV">0</b><div class="meter"><i id="hateB" style="width:0%"></i></div></div>
  <div class="stat relation"><label>爱意</label><b id="loveV">3</b><div class="meter"><i id="loveB" style="width:3%"></i></div></div>
 </div><div class="stat-group"><div class="stat-group-title">生存</div>
  <div class="stat"><label>精力</label><b id="energyV">78</b><div class="meter"><i id="energyB" style="width:78%"></i></div></div>
  <div class="stat"><label>食欲</label><b id="hungerV">62</b><div class="meter"><i id="hungerB" style="width:62%"></i></div></div>
  <div class="stat"><label>卫生</label><b id="cleanV">86</b><div class="meter"><i id="cleanB" style="width:86%"></i></div></div>
  <div class="stat"><label>娱乐</label><b id="funV">70</b><div class="meter"><i id="funB" style="width:70%"></i></div></div>
 </div></aside>

<main class="stage" id="stage">
 <div class="dialogue-pill" id="dialogue" style="display:none"></div><section class="calendar-view" id="calendarView"><div class="calendar-view-head"><div><h2>Arday · 时间安排</h2></div></div><div class="calendar-content" id="calendarContent"></div></section>

 <button class="room-label" id="roomLabel" type="button" aria-label="当前房间">起居室</button><div class="camera-controls" id="cameraControls" role="group" aria-label="视角控制"><button type="button" id="cameraPan" class="active" aria-pressed="true">平移</button><button type="button" id="cameraOrbit" aria-pressed="false">旋转</button></div>
 <section class="drawer" id="drawer"><div class="drawer-head"><strong id="drawerTitle">互动</strong></div><div class="choices" id="choices"></div></section>
</main>
</div>
<footer class="bottom">
 <nav class="toolbar" aria-label="游戏操作">
  <button class="tool" data-tab="互动"><span class="icon">✧</span>互动</button>
  <button class="tool" data-tab="物品"><span class="icon">▣</span>物品</button>
  <button class="tool" data-tab="商店"><span class="icon">♧</span>商店</button>
  <button class="tool" data-tab="日程"><span class="icon">✧</span>日程</button>
  <button class="tool" data-tab="目标"><span class="icon">◇</span>目标</button>
  <button class="tool" data-tab="账户"><span class="icon">◈</span>账户</button>
  <button class="tool" data-tab="职业"><span class="icon">▤</span>职业</button>
 </nav>
 <div class="bottom-actions"><button class="recent-entry" id="recentEvents">✦ 最近<b id="eventCount"></b></button><button class="top-action decorate" id="decorate">✧ 装修</button></div>
</footer>
</div><div class="toast" id="toast"></div>

<script src="assets/js/game-config.js?v=20261120r"></script>
<script src="assets/js/furniture-placement.js?v=20261120r"></script>
<script src="assets/js/economy.js?v=20261120r"></script>
<script src="assets/js/game.js?v=20261120r"></script>
<script>
document.body.classList.toggle("standalone",window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js",{scope:"./"}).catch(error=>console.warn("Offline support unavailable:",error)));}
</script>
</body></html>
