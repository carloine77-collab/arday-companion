<html lang="zh-CN">
<head>

<title>Arday · 阿尔</title>
<style>
:root{--paper:#f2e7d4;--cream:#fff9ef;--ink:#453a30;--muted:#8c7d6c;--line:#dfcfb8;--orange:#d77d50;--green:#819477;--rose:#bd7169;--shadow:0 8px 24px #5c49301a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--paper);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}.app{height:100svh;max-width:1100px;margin:auto;padding:calc(8px + env(safe-area-inset-top)) 14px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:9px}
.top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}.identity{display:flex;align-items:center;gap:8px;white-space:nowrap}.mark{width:35px;height:35px;border-radius:12px;background:var(--orange);color:white;display:grid;place-items:center;font:700 20px Georgia;box-shadow:0 3px 0 #a75e3d}.name{font:700 17px Georgia}.date{font-size:10px;color:var(--muted);margin-top:2px}.stats{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;min-width:0;background:var(--cream);border:1px solid var(--line);border-radius:15px;padding:7px 8px;box-shadow:var(--shadow)}.stat{min-width:0;text-align:center;border-right:1px solid #eadfce;padding:0 3px}.stat:last-child{border:0}.stat label{display:block;font-size:10px;color:var(--muted);white-space:nowrap}.stat b{display:block;font-size:12px;margin:2px 0 4px}.meter{height:4px;border-radius:9px;background:#eee4d6;overflow:hidden}.meter i{display:block;height:100%;border-radius:9px;background:var(--green)}.stat.relation:nth-child(2) .meter i,.stat.relation:nth-child(3) .meter i{background:#d39a62}.stat.relation:nth-child(4) .meter i,.stat.relation:nth-child(5) .meter i{background:#bd7169}
.stage{position:relative;min-height:0;overflow:hidden;border:1px solid #d9c6a9;border-radius:23px;background:#eadfc9;box-shadow:var(--shadow);isolation:isolate}.scene-bg{position:absolute;inset:0;background:linear-gradient(180deg,#f1dfc2 0%,#e9d8bc 54%,#d4b995 54%,#c9a77e 100%)}.sunlight{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 17%,#fff6d766,transparent 42%);pointer-events:none}
.room{position:absolute;inset:0;perspective:900px}.backwall{position:absolute;left:5%;right:5%;top:4%;height:54%;background:linear-gradient(180deg,#f2e4ca,#e8d7b9);border:2px solid #d4bd9d;border-bottom:8px solid #c5a782;box-shadow:inset 0 0 0 8px #f5ead7}.floor{position:absolute;left:0;right:0;bottom:0;height:45%;background:repeating-linear-gradient(0deg,#caa982 0 2px,#d8bd98 2px 43px);clip-path:polygon(5% 0,95% 0,100% 100%,0 100%);border-top:5px solid #b68e68}.floor:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 110px,#b58e6a22 111px 113px)}.window{position:absolute;left:12%;top:11%;width:24%;height:37%;border:9px solid #a97854;border-bottom-width:12px;border-radius:8px;background:linear-gradient(145deg,#b9d0c0,#f2d9a9);box-shadow:inset 0 0 0 3px #f8ecd8}.window:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:5px;background:#a97854}.window:after{content:"";position:absolute;left:0;right:0;top:52%;height:5px;background:#a97854}.outside-sun{position:absolute;right:15%;top:14%;width:35px;height:35px;border-radius:50%;background:#f2bd70;box-shadow:0 0 30px #f6cb89aa}.wall-shelf{position:absolute;right:12%;top:20%;width:23%;height:9px;background:#a87852;box-shadow:0 5px 0 #d7b18b}.wall-shelf:after{content:"📚　🪴";position:absolute;right:8px;bottom:8px;font-size:24px;white-space:nowrap}.picture{position:absolute;right:16%;top:38%;width:65px;height:74px;border:7px solid #ae805b;background:#f8eedc;display:grid;place-items:center;font-size:28px;transform:rotate(2deg)}
.rug{position:absolute;left:28%;bottom:7%;width:46%;height:23%;border-radius:50%;background:#d59d79;border:7px solid #bd8564;box-shadow:inset 0 0 0 3px #eac5a1}.sofa{position:absolute;left:7%;bottom:20%;width:27%;height:23%;border-radius:17px 17px 10px 10px;background:#819477;border:5px solid #6f8066;box-shadow:inset 0 -10px #718368,0 9px 0 -3px #956a4b}.sofa:after{content:"";position:absolute;left:50%;top:8px;bottom:7px;width:4px;background:#6f8066}.table{position:absolute;right:9%;bottom:18%;width:23%;height:13px;border-radius:50%;background:#a8754e;box-shadow:0 8px 0 -2px #8c6040}.table:after{content:"";position:absolute;left:13%;right:13%;top:7px;height:36px;border-left:6px solid #8c6040;border-right:6px solid #8c6040}.plant-pot{position:absolute;right:8%;bottom:34%;font-size:34px;filter:drop-shadow(0 4px 2px #76563b33)}.lamp{position:absolute;left:39%;bottom:28%;font-size:36px}
.person{position:absolute;left:51%;bottom:13%;width:112px;height:194px;transform:translateX(-50%);z-index:4;transition:left .35s,transform .3s;filter:drop-shadow(0 5px 3px #5e49352b)}.person .shadow{position:absolute;bottom:0;left:7px;width:98px;height:17px;border-radius:50%;background:#6e513b40}.legs{position:absolute;bottom:8px;left:33px;width:48px;height:29px;border-radius:8px 8px 13px 13px;background:#5f5148}.torso{position:absolute;bottom:27px;left:19px;width:75px;height:94px;border:4px solid #a85f45;border-radius:32px 32px 19px 19px;background:#d27b50}.neck{position:absolute;bottom:112px;left:46px;width:20px;height:17px;background:#d9a17c}.head{position:absolute;left:18px;bottom:116px;width:76px;height:78px;border:4px solid #98674f;border-radius:44% 46% 42% 42%;background:#d9a17c;z-index:2}.hair{position:absolute;left:10px;top:-9px;width:80px;height:39px;border-radius:50% 55% 25% 25%;background:#493d35;z-index:3;transform:rotate(-4deg)}.hair:after{content:"";position:absolute;right:5px;top:17px;width:26px;height:30px;border-radius:0 0 60% 20%;background:#493d35;transform:rotate(-13deg)}.ear{position:absolute;top:27px;width:13px;height:20px;border-radius:50%;background:#d9a17c;border:3px solid #98674f}.ear.l{left:-9px}.ear.r{right:-9px}.eye{position:absolute;top:39px;width:6px;height:8px;border-radius:50%;background:#493d35;z-index:4}.eye.l{left:20px}.eye.r{right:19px}.nose{position:absolute;left:34px;top:51px;width:7px;height:5px;border-radius:50%;background:#a86d5c;z-index:4}.mouth{position:absolute;left:30px;top:59px;width:14px;height:7px;border-bottom:2px solid #91594e;border-radius:50%;z-index:4}.arm{position:absolute;top:111px;width:19px;height:59px;border-radius:15px;background:#d9a17c;border:3px solid #98674f;z-index:1}.arm.l{left:8px;transform:rotate(12deg)}.arm.r{right:8px;transform:rotate(-12deg)}.person.wave .arm.r{transform:rotate(-65deg);top:92px}.person.sit{transform:translate(-50%,10px) scale(.92)}.person.walk{left:68%}
.bubble{position:absolute;left:50%;top:5%;transform:translateX(-50%);z-index:6;max-width:min(78%,440px);padding:10px 15px;background:#fff9ed;border:1px solid #e0ceb3;border-radius:16px 16px 16px 5px;text-align:center;font-size:13px;line-height:1.5;box-shadow:0 5px 15px #624b2c1c}.room-label{position:absolute;left:15px;bottom:12px;font-size:10px;letter-spacing:1.5px;color:#6e5b47;z-index:5}
.hotspot{position:absolute;z-index:7;border:1px solid #fff4d6aa;background:#fff8e8aa;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-size:17px;box-shadow:0 2px 8px #57432a22}.hotspot:active{transform:scale(.92)}.spot-sofa{left:20%;bottom:36%}.spot-window{left:20%;top:39%}.spot-table{right:16%;bottom:31%}.decorate{position:absolute;right:12px;top:12px;z-index:8;background:#fff9eddd;border:1px solid #dfcdb4;border-radius:12px;padding:9px 13px;font-size:12px;font-weight:650}.edit-hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:9;padding:7px 12px;background:#493f34dd;color:#fff7e9;border-radius:12px;font-size:11px;white-space:nowrap;display:none}.stage.editing .edit-hint{display:block}.stage.editing .hotspot{outline:3px solid #e6a46c}
.bottom{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}.toolbar{display:flex;gap:7px}.tool{min-width:76px;height:47px;border-radius:14px;border:1px solid var(--line);background:var(--cream);box-shadow:0 3px 0 #d9c7ad;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:650}.tool .icon{font-size:18px}.tool.active{background:#f1ddc4;border-color:#d8ae84;box-shadow:0 2px 0 #c99b70}.chat{height:47px;display:flex;gap:7px;padding:4px;background:var(--cream);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);min-width:0}.chat input{min-width:0;flex:1;border:0;outline:0;background:transparent;padding:0 10px;color:var(--ink);font-size:13px}.chat input::placeholder{color:#a29482}.send{border:0;border-radius:11px;background:var(--orange);color:white;padding:0 17px;font-weight:650}
.drawer{position:absolute;left:50%;bottom:12px;transform:translate(-50%,15px);opacity:0;pointer-events:none;width:min(92%,560px);max-height:42%;overflow:auto;z-index:12;background:#fff9ef;border:1px solid #deccb3;border-radius:18px;padding:13px;box-shadow:0 10px 30px #44331e35;transition:.2s}.drawer.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.drawer-head strong{font:700 16px Georgia}.close{background:#f1e5d4;border-radius:9px;padding:5px 10px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{background:#f8efdf;border:1px solid #e5d5bf;border-radius:12px;padding:11px 7px;text-align:center;font-size:12px}.choice .emoji{display:block;font-size:21px;margin-bottom:5px}.choice small{display:block;color:var(--muted);margin-top:4px;font-size:10px}.toast{position:fixed;left:50%;bottom:calc(75px + env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:30;background:#493f34;color:white;border-radius:12px;padding:10px 15px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.app{padding-left:8px;padding-right:8px;gap:7px}.top{grid-template-columns:1fr;gap:5px}.identity{display:none}.stats{padding:6px 4px;gap:1px}.stat label{font-size:9px}.stat b{font-size:11px}.stage{border-radius:18px}.backwall{left:2%;right:2%}.window{left:8%;width:27%}.person{transform:translateX(-50%) scale(.83);transform-origin:bottom center}.person.sit{transform:translate(-50%,10px) scale(.78)}.tool{min-width:61px;height:44px;gap:3px;font-size:12px}.tool .icon{font-size:16px}.bottom{gap:6px}.chat{height:44px}.send{padding:0 12px}.room-label{font-size:9px}}
@media(max-width:390px){.stat label{font-size:8px}.stat b{font-size:10px}.stats{padding:5px 2px}.tool{min-width:53px}.chat input{font-size:12px}.send{padding:0 9px}}
@media(orientation:landscape) and (max-height:560px){.app{gap:5px;padding-top:5px;padding-bottom:5px}.stats{padding:4px 7px}.stage{border-radius:16px}.bottom .tool,.chat{height:40px}.person{transform:translateX(-50%) scale(.72);transform-origin:bottom center}.person.sit{transform:translate(-50%,10px) scale(.68)}.bubble{top:3%;padding:7px 12px}}

/* Calendar and autonomous schedule */
.schedule-peek{position:absolute;z-index:10;left:10px;top:68px;bottom:48px;width:clamp(112px,22%,174px);max-height:calc(100% - 125px);display:flex;flex-direction:column;background:rgba(255,249,239,.30);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,.55);border-radius:15px;overflow:hidden;box-shadow:0 4px 16px #59442b16}
.peek-head{padding:7px 9px 5px;background:rgba(255,249,239,.35);display:flex;justify-content:space-between;align-items:center;color:#594a39;font-size:11px;font-weight:700}.peek-head span{font-size:9px;font-weight:500;opacity:.8}
.peek-list{overflow:auto;scrollbar-width:none;padding:3px 5px 6px}.peek-list::-webkit-scrollbar{display:none}.peek-row{display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px;align-items:stretch;min-height:27px;border-bottom:1px solid #725f4920}.peek-time{font-size:9px;color:#665746;padding-top:6px;text-align:center}.peek-event{border:0;border-radius:6px;margin:2px 0;padding:4px 5px;text-align:left;background:rgba(255,250,240,.66);font-size:9px;line-height:1.25;overflow:hidden;color:#514334;min-width:0}.peek-event.free{background:rgba(255,255,255,.13);border:1px dashed #786b5740;color:#766a59}.peek-event.current{outline:1px solid #d58b5e}.peek-event small{display:block;font-size:8px;opacity:.75;margin-top:2px}.peek-foot{padding:4px 7px;background:rgba(255,249,239,.32);font-size:8px;color:#6d5e4d;text-align:center}
.calendar-panel{display:flex;flex-direction:column;gap:9px}.calendar-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.calendar-tab{border:1px solid #e4d3bd;background:#f8efdf;border-radius:10px;padding:8px 3px;font-size:11px}.calendar-tab.active{background:#e9c9a8;border-color:#d5a477;font-weight:700}.calendar-note{font-size:10px;color:#867765;line-height:1.4}.calendar-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;max-height:230px;overflow:auto}.calendar-slot{min-height:45px;border:1px solid #e6d7c4;border-radius:9px;background:#fbf5e9;padding:6px;text-align:left;font-size:10px}.calendar-slot strong{display:block;font-size:10px;color:#8d735b;margin-bottom:3px}.calendar-slot.free{border-style:dashed;background:#fffaf2}.calendar-slot.booked{background:#e9eddf;border-color:#cbd4bf}.calendar-slot.pending{background:#f7e5d3;border-color:#e6c19e}.calendar-actions{display:flex;gap:6px;flex-wrap:wrap}.calendar-actions button{border:1px solid #dfcdb5;background:#f6ecdd;border-radius:9px;padding:8px 10px;font-size:11px}
@media(max-width:700px){.schedule-peek{left:6px;top:58px;bottom:38px;width:clamp(105px,32%,138px);max-height:calc(100% - 100px)}.peek-head{padding:6px 7px}.peek-event{font-size:8px;padding:4px}.peek-time{font-size:8px}.calendar-grid{grid-template-columns:1fr;max-height:210px}.tool[data-tab="日程"]{min-width:57px}}
@media(max-width:390px){.schedule-peek{width:106px}.peek-event{font-size:7px}.peek-time{font-size:7px}.tool[data-tab="日程"]{min-width:49px}}

.stage.calendar-mode{background:#eee3d0}.stage.calendar-mode>.scene-bg,.stage.calendar-mode>.sunlight,.stage.calendar-mode>.room,.stage.calendar-mode>.bubble,.stage.calendar-mode>.room-label,.stage.calendar-mode>.decorate,.stage.calendar-mode>.hotspot,.stage.calendar-mode>.edit-hint,.stage.calendar-mode>.schedule-peek{display:none}.calendar-view{display:none;position:absolute;inset:0;padding:15px;background:linear-gradient(145deg,#f5ead8,#e9dcc7);overflow:hidden}.stage.calendar-mode .calendar-view{display:flex;flex-direction:column;gap:11px}.calendar-view-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}.calendar-view-head h2{font:700 20px Georgia;margin:0;color:#514334}.calendar-view-head p{font-size:10px;color:#887965;margin:4px 0 0}.back-room{border:1px solid #dfcbb0;background:#fff9ef;border-radius:11px;padding:9px 13px;font-size:11px;font-weight:650;white-space:nowrap}.calendar-content{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;min-height:0;flex:1}.day-card{background:#fff9efb8;border:1px solid #dfcfb8;border-radius:15px;display:flex;flex-direction:column;min-width:0;overflow:hidden}.day-card.today{border-color:#d8a47b;box-shadow:inset 0 3px #d88b5b}.day-card-head{padding:10px 11px 8px;border-bottom:1px solid #e9dece;display:flex;justify-content:space-between;align-items:center;gap:5px}.day-card-head strong{font-size:13px}.day-card-head small{font-size:9px;color:#92816d}.day-timeline{overflow:auto;min-height:0;flex:1;padding:4px 7px;scrollbar-width:thin}.day-slot{display:grid;grid-template-columns:39px minmax(0,1fr);gap:5px;align-items:stretch;min-height:30px;border-bottom:1px solid #eee5d8}.day-slot time{font-size:9px;color:#9a8873;padding-top:8px;text-align:right}.day-slot button{border:0;border-radius:7px;background:transparent;text-align:left;padding:5px 7px;font-size:10px;color:#796b5b;min-width:0;line-height:1.25}.day-slot button.free{border:1px dashed #d9cbb7;margin:3px 0;background:#fffdf8;color:#9a8b78}.day-slot button.busy{background:#e9eddf;color:#59664e;margin:3px 0}.day-slot button.proposal{background:#f7e5d3;color:#865c3c;margin:3px 0}.day-slot button.now{outline:1px solid #d58b5e}.day-legend{font-size:9px;color:#95836e;padding:7px 10px;border-top:1px solid #eee5d8}.calendar-actions{display:flex;gap:6px;flex-wrap:wrap}.calendar-actions button{border:1px solid #dfcdb5;background:#f6ecdd;border-radius:9px;padding:8px 10px;font-size:11px}@media(max-width:700px){.calendar-view{padding:9px;gap:7px}.calendar-view-head h2{font-size:16px}.calendar-content{gap:5px}.day-card{border-radius:11px}.day-card-head{padding:8px 6px;display:block}.day-card-head strong{display:block;font-size:11px}.day-card-head small{font-size:8px}.day-timeline{padding:3px}.day-slot{grid-template-columns:29px minmax(0,1fr);gap:2px;min-height:31px}.day-slot time{font-size:8px}.day-slot button{font-size:8px;padding:5px 3px}.day-legend{font-size:8px;padding:5px}}@media(max-width:390px){.calendar-view{padding:6px}.calendar-content{gap:3px}.day-card-head{padding:6px 4px}.day-card-head strong{font-size:10px}.day-slot{grid-template-columns:25px minmax(0,1fr)}.day-slot time{font-size:7px}.day-slot button{font-size:7px}}@media(orientation:landscape) and (max-height:560px){.calendar-view{padding:7px}.calendar-content{gap:7px}.day-slot{min-height:25px}.day-slot time{padding-top:6px}}</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="identity"><div class="mark">A</div><div><div class="name">Arday · 阿尔</div><div class="date" id="date">—</div></div></div>
 <section class="stats" aria-label="角色状态">
  <div class="stat relation"><label>友谊</label><b id="friendV">24</b><div class="meter"><i id="friendB" style="width:24%"></i></div></div>
  <div class="stat relation"><label>依恋</label><b id="attachV">12</b><div class="meter"><i id="attachB" style="width:12%"></i></div></div>
  <div class="stat relation"><label>厌倦</label><b id="boredV">4</b><div class="meter"><i id="boredB" style="width:4%"></i></div></div>
  <div class="stat relation"><label>恨意</label><b id="hateV">0</b><div class="meter"><i id="hateB" style="width:0%"></i></div></div>
  <div class="stat relation"><label>爱意</label><b id="loveV">3</b><div class="meter"><i id="loveB" style="width:3%"></i></div></div>
  <div class="stat"><label>精力</label><b id="energyV">78</b><div class="meter"><i id="energyB" style="width:78%"></i></div></div>
  <div class="stat"><label>食欲</label><b id="hungerV">62</b><div class="meter"><i id="hungerB" style="width:62%"></i></div></div>
  <div class="stat"><label>卫生</label><b id="cleanV">86</b><div class="meter"><i id="cleanB" style="width:86%"></i></div></div>
  <div class="stat"><label>娱乐</label><b id="funV">70</b><div class="meter"><i id="funB" style="width:70%"></i></div></div>
 </section>
</header>
<main class="stage" id="stage">
 <div class="scene-bg"></div><div class="sunlight"></div>
 <div class="room">
  <div class="backwall"></div><div class="window"></div><div class="outside-sun" id="sun"></div><div class="wall-shelf"></div><div class="picture">🌿</div>
  <div class="floor"></div><div class="rug"></div><div class="sofa"></div><div class="table"></div><div class="plant-pot">🪴</div><div class="lamp">🪔</div>
  <div class="person" id="person"><div class="shadow"></div><div class="legs"></div><div class="arm l"></div><div class="arm r"></div><div class="torso"></div><div class="neck"></div><div class="head"><div class="hair"></div><div class="ear l"></div><div class="ear r"></div><div class="eye l"></div><div class="eye r"></div><div class="nose"></div><div class="mouth"></div></div></div>
 </div>
 <div class="bubble" id="bubble">你来了。刚才我在看窗外。</div><section class="calendar-view" id="calendarView"><div class="calendar-view-head"><div><h2>Arday · 时间安排</h2><p>阿尔的生活有自己的节奏，你可以和他协商共同安排。</p></div><button class="back-room" id="backRoom">返回房间</button></div><div class="calendar-content" id="calendarContent"></div></section>

 <div class="room-label" id="roomLabel">HOME · 现在</div>
 <button class="decorate" id="decorate">✦ 装修</button>
 <button class="hotspot spot-sofa" data-object="沙发" aria-label="沙发">▰</button>
 <button class="hotspot spot-window" data-object="窗户" aria-label="窗户">☼</button>
 <button class="hotspot spot-table" data-object="茶几" aria-label="茶几">♧</button>
 <div class="edit-hint">选择一个房间物件进行调整 · 再点一次装修退出</div>
 <section class="drawer" id="drawer"><div class="drawer-head"><strong id="drawerTitle">互动</strong><button class="close" id="closeDrawer">收起</button></div><div class="choices" id="choices"></div></section>
</main>
<footer class="bottom">
 <nav class="toolbar" aria-label="游戏操作">
  <button class="tool" data-tab="互动"><span class="icon">✧</span>互动</button>
  <button class="tool" data-tab="物品"><span class="icon">▣</span>物品</button>
  <button class="tool" data-tab="商店"><span class="icon">♧</span>商店</button>

 <form class="chat" id="chatForm"><input id="message" maxlength="160" placeholder="和阿尔说点什么……" autocomplete="off"><button class="send">发送</button></form>
</footer>
</div><div class="toast" id="toast"></div>
<script>
(()=>{
const $=id=>document.getElementById(id),clamp=n=>Math.max(0,Math.min(100,Math.round(n)));
const base={friend:24,attach:12,bored:4,hate:0,love:3,energy:78,hunger:62,clean:86,fun:70,last:Date.now(),coins:80,items:['一本旧书','陶杯'],visits:0};
let s={...base};try{const old=JSON.parse(localStorage.getItem('arday-save-v2')||'null');if(old)s={...base,...old}}catch(e){}
const keys=['friend','attach','bored','hate','love','energy','hunger','clean','fun'];
function save(){s.last=Date.now();try{localStorage.setItem('arday-save-v2',JSON.stringify(s))}catch(e){}}
function render(){keys.forEach(k=>{$(k+'V').textContent=s[k];$(k+'B').style.width=s[k]+'%'})}
function say(t){$('bubble').textContent=t}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function clock(){let d=new Date(),h=d.getHours();$('date').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})+' '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});$('roomLabel').textContent=(h<6?'LATE NIGHT':h<10?'MORNING':h<17?'AFTERNOON':h<20?'EVENING':'NIGHT')+' · HOME';$('sun').style.opacity=h<6||h>20?'.12':h<9||h>17?'.55':'1'}
function offline(){let hrs=Math.max(0,(Date.now()-(s.last||Date.now()))/3600000);if(hrs>.1){s.energy=clamp(s.energy+Math.min(14,hrs*1.4));s.hunger=clamp(s.hunger-Math.min(18,hrs*.8));s.clean=clamp(s.clean-Math.min(10,hrs*.35));s.fun=clamp(s.fun-Math.min(12,hrs*.45));s.bored=clamp(s.bored+Math.min(8,hrs*.25));}}
function animate(type){let p=$('person');p.classList.remove('wave','sit','walk');void p.offsetWidth;p.classList.add(type)}
function interact(id){const p={
chat:['我在听。你想从哪里说起？',{friend:2,attach:1,fun:3}],
tea:['这杯茶不错。坐一会儿吧。',{friend:1,attach:1,energy:2,fun:5}],
music:['这首歌我喜欢。你注意到中间的变化了吗？',{friend:2,fun:9,energy:-1}],
walk:['走吧，出去看看。回来再继续聊。',{friend:2,attach:1,fun:12,energy:-8,clean:-2}],
book:['我刚读到一段有意思的内容。',{friend:2,attach:1,fun:5,energy:-2}],
game:['这局我可不会让着你。',{friend:1,fun:12,energy:-4}],
rest:['我想安静地休息一会儿。',{energy:12,fun:-1}],
compliment:['突然这么说？……我会记住的。',{attach:2,love:1,friend:1}],
tease:['你这是故意逗我？',{bored:1,fun:4}],
food:['谢谢，我正好有点饿了。',{hunger:18,friend:1}]
};let a=p[id];if(!a)return;say(a[0]);Object.entries(a[1]).forEach(([k,v])=>s[k]=clamp(s[k]+v));animate(id==='tea'||id==='book'||id==='rest'?'sit':id==='walk'?'walk':'wave');save();render()}
const tabs={
'互动':[['聊天','💬','chat'],['一起喝茶','🍵','tea'],['听音乐','♫','music'],['出门散步','🌿','walk'],['一起看书','📖','book'],['玩个游戏','🎲','game'],['休息一会','☁','rest'],['夸夸他','✦','compliment'],['开个玩笑','☻','tease']],
'物品':[['旧书','📖','book'],['陶杯','☕','tea'],['点心','🥐','food'],['唱片','💿','music']],
'商店':[['点心','🥐','buy-food'],['唱片','💿','buy-record'],['绿植','🪴','buy-plant'],['抱枕','🟠','buy-cushion']]
};
function openTab(name){if(name==='日程'){openCalendar();return}$('drawerTitle').textContent=name;$('choices').innerHTML='';tabs[name].forEach(([label,emoji,id])=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<span class="emoji">'+emoji+'</span>'+label+(name==='商店'?'<small>查看 / 购买</small>':'');b.addEventListener('click',()=>{if(id.startsWith('buy-')){let cost= id==='buy-food'?12:id==='buy-record'?28:35;if(s.coins<cost){toast('金币不足');return}s.coins-=cost;s.items.push(label);toast('买下了：'+label);say('这个东西放在房间里应该不错。');}else if(name==='物品'){if(id==='food')interact('food');else interact(id);say('你拿出了'+label+'。'+$('bubble').textContent)}else interact(id);save();render();});$('choices').appendChild(b)});$('drawer').classList.add('open');document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tab===name))}

/* Three-day calendar: the current plan rolls over at 06:00 local time. */
const pad=n=>String(n).padStart(2,'0');
function dayKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function scheduleAnchor(){let d=new Date();if(d.getHours()<6)d.setDate(d.getDate()-1);d.setHours(0,0,0,0);return d}
function plusDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function dayLabel(d){return d.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric',weekday:'short'})}
function ensureSchedule(){
 const anchor=scheduleAnchor(),key=dayKey(anchor);
 if(!s.calendar||s.calendar.anchor!==key){
  const templates=[
   [{h:7,title:'起床、洗漱',kind:'routine'},{h:8,title:'吃早餐',kind:'routine'},{h:9,title:'阅读一会儿',kind:'personal'},{h:12,title:'午餐',kind:'routine'},{h:14,title:'自由时间',kind:'free'},{h:16,title:'整理房间',kind:'personal'},{h:19,title:'晚餐',kind:'routine'},{h:20,title:'听音乐',kind:'personal'}],
  ];
  s.calendar={anchor:key,days:{[key]:templates[0].map(x=>({start:x.h,end:x.h+1,title:x.title,kind:x.kind}))}};
  for(let i=1;i<=2;i++)s.calendar.days[dayKey(plusDays(anchor,i))]=[];
  save();
 }
 for(let i=0;i<3;i++){let k=dayKey(plusDays(anchor,i));if(!s.calendar.days[k])s.calendar.days[k]=[]}
}
let calendarOffset=0,selectedSlot=null;
function eventAt(key,h){return (s.calendar.days[key]||[]).find(e=>h>=e.start&&h<e.end)}
function renderCalendarBoard(){
 ensureSchedule();let anchor=scheduleAnchor(),key=dayKey(anchor),now=new Date(),html='';
 $('peekDate').textContent=dayLabel(anchor);
 for(let h=6;h<23;h++){
  let ev=eventAt(key,h),isNow=dayKey(now)===key&&now.getHours()===h;
  html+='<div class="peek-row"><span class="peek-time">'+pad(h)+':00</span><button class="peek-event '+(ev?'':'free')+(isNow?' current':'')+'" data-hour="'+h+'">'+(ev?ev.title:'空闲')+(ev?'<small>'+pad(ev.start)+':00–'+pad(ev.end)+':00</small>':'')+'</button></div>';
 }
 $('peekList').innerHTML=html;
 $('peekList').querySelectorAll('[data-hour]').forEach(b=>b.onclick=()=>slotClick(0,+b.dataset.hour));
}
function openCalendar(){
 ensureSchedule();calendarOffset=0;renderCalendarBoard();$('drawer').classList.add('open');document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tab==='日程'));
}
function renderCalendarBoard(){
 ensureSchedule();let anchor=scheduleAnchor(),days=[0,1,2].map(i=>plusDays(anchor,i)),key=dayKey(days[calendarOffset]),events=s.calendar.days[key]||[];
 $('drawerTitle').textContent='时间协商';
 let tabNames=['今天','明天','后天'];
 let html='<div class="calendar-panel"><div class="calendar-tabs">'+days.map((d,i)=>'<button class="calendar-tab '+(i===calendarOffset?'active':'')+'" data-day="'+i+'">'+tabNames[i]+'<br>'+dayLabel(d)+'</button>').join('')+'</div><div class="calendar-note">'+(calendarOffset===0?'这是阿尔今天自己安排的日程。空白时间可以向他提出邀请。':calendarOffset===1?'明天和阿尔的时间目前留白。你可以提出共同安排，他也可以拒绝或另作提议。':'后天暂时没有安排。点击空白时段，和阿尔商量是否预留时间。')+'</div><div class="calendar-grid">';
 for(let h=6;h<23;h++){
  let ev=eventAt(key,h);
  html+='<button class="calendar-slot '+(ev?(ev.kind==='proposal'?'pending':'booked'):'free')+'" data-hour="'+h+'"><strong>'+pad(h)+':00</strong>'+(ev?ev.title:'＋ 空闲')+'</button>';
 }
 html+='</div><div class="calendar-actions"><button id="calendar-refresh">刷新日程</button><button id="calendar-close">收起</button></div></div>';
 $('choices').innerHTML=html;
 $('choices').querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{calendarOffset=+b.dataset.day;renderCalendarBoard()});
 $('choices').querySelectorAll('[data-hour]').forEach(b=>b.onclick=()=>slotClick(calendarOffset,+b.dataset.hour));
 $('calendar-close').onclick=()=>$('drawer').classList.remove('open');
 $('calendar-refresh').onclick=()=>{ensureSchedule();renderCalendarBoard();renderCalendarBoard();toast('日程已更新')};
}
function slotClick(dayIndex,h){
 ensureSchedule();calendarOffset=dayIndex;let d=plusDays(scheduleAnchor(),dayIndex),key=dayKey(d),ev=eventAt(key,h);
 if(ev){
  $('drawerTitle').textContent=pad(ev.start)+':00 · '+ev.title;
  $('choices').innerHTML='<div class="calendar-panel"><div class="calendar-note">'+(ev.kind==='proposal'?'这是你提出的安排。': '这是阿尔自己安排的时间。')+'</div><div class="calendar-actions"><button id="ask-join">问他能否一起</button><button id="ask-change">商量调整时间</button><button id="ask-cancel">让他自由安排</button><button id="back-calendar">返回日程</button></div></div>';
  $('ask-join').onclick=()=>{say(ev.kind==='routine'?'这件事我想自己完成，不过结束后可以一起待一会儿。':'好啊，一起做也不错。');s.friend=clamp(s.friend+1);s.attach=clamp(s.attach+1);save();render();$('drawer').classList.remove('open');toast('你们商量了这段时间')};
  $('ask-change').onclick=()=>{say('可以商量。你希望换到什么时候？');$('drawer').classList.remove('open');toast('之后可以在空白时段提出新安排')};
  $('ask-cancel').onclick=()=>{s.calendar.days[key]=s.calendar.days[key].filter(x=>x!==ev);save();renderCalendarBoard();renderCalendarBoard();say('好，这段时间我自己决定。')};
  $('back-calendar').onclick=renderCalendar;
  return;
 }
 const proposedTitle=dayIndex===0?'和你一起待一会儿':'和你见面 / 一起活动';
 $('drawerTitle').textContent='提出安排 · '+dayLabel(d)+' '+pad(h)+':00';
 $('choices').innerHTML='<div class="calendar-panel"><div class="calendar-note">你想邀请阿尔在 '+pad(h)+':00 开始留出一小时。选择一个提议：</div><div class="choices">'+[['一起吃点东西','🥐'],['散步','🌿'],['听音乐','♫'],['一起看书','📖'],['玩游戏','🎲'],['自由相处','☁']].map((x,i)=>'<button class="choice" data-propose="'+i+'"><span class="emoji">'+x[1]+'</span>'+x[0]+'</button>').join('')+'</div><div class="calendar-actions"><button id="back-calendar">返回日程</button></div></div>';
 $('choices').querySelectorAll('[data-propose]').forEach(b=>b.onclick=()=>{
  let i=+b.dataset.propose,names=['一起吃点东西','散步','听音乐','一起看书','玩游戏','自由相处'];
  let chance=s.friend+s.attach-s.bored*.5+(s.energy-50)*.15;
  let accepted=dayIndex>0?chance>18:chance>10;
  if(accepted){
   s.calendar.days[key].push({start:h,end:h+1,title:names[i],kind:'proposal',byPlayer:true});
   s.calendar.days[key].sort((a,b)=>a.start-b.start);
   say(dayIndex===0?'嗯，这个时间我可以留出来。':'可以，我先把这段时间留给我们。');
   s.friend=clamp(s.friend+1);s.attach=clamp(s.attach+1);toast('阿尔接受了你的提议');
  }else{
   say('这个时间我不太想这样安排。我们可以换个时间，或者到时候再说。');
   s.bored=clamp(s.bored+1);toast('阿尔暂时没有接受');
  }
  save();render();renderCalendarBoard();renderCalendarBoard();
 });
 $('back-calendar').onclick=renderCalendar;
}


// Dedicated three-column calendar view; replaces the former overlay calendar.
function renderCalendarBoard(){
 ensureSchedule();let anchor=scheduleAnchor(),now=new Date(),html='';
 for(let di=0;di<3;di++){
  let d=plusDays(anchor,di),key=dayKey(d),label=['今天','明天','后天'][di];
  html+='<section class="day-card '+(di===0?'today':'')+'"><div class="day-card-head"><strong>'+label+'</strong><small>'+dayLabel(d)+'</small></div><div class="day-timeline">';
  for(let h=6;h<23;h++){let ev=eventAt(key,h),isNow=di===0&&now.getHours()===h;html+='<div class="day-slot"><time>'+pad(h)+':00</time><button class="'+(ev?(ev.kind==='proposal'?'proposal':'busy'):'free')+(isNow?' now':'')+'" data-day="'+di+'" data-hour="'+h+'">'+(ev?ev.title:'＋ 空闲')+'</button></div>'}
  html+='</div><div class="day-legend">'+(di===0?'阿尔今天的个人安排与空闲时间':di===1?'明天 · 等待双方协商':'后天 · 暂无预设安排')+'</div></section>';
 }
 $('calendarContent').innerHTML=html;
 $('calendarContent').querySelectorAll('[data-hour]').forEach(b=>b.onclick=()=>slotClick(+b.dataset.day,+b.dataset.hour));
}
function openCalendar(){ensureSchedule();$('drawer').classList.remove('open');$('stage').classList.add('calendar-mode');renderCalendarBoard();document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tab==='日程'))}
function closeCalendar(){$('stage').classList.remove('calendar-mode');$('drawer').classList.remove('open');document.querySelectorAll('.tool').forEach(b=>b.classList.remove('active'))}
function slotClick(dayIndex,h){
 ensureSchedule();let d=plusDays(scheduleAnchor(),dayIndex),key=dayKey(d),ev=eventAt(key,h);
 if(ev){
  $('drawerTitle').textContent=pad(ev.start)+':00 · '+ev.title;
  $('choices').innerHTML='<div class="calendar-panel"><div class="calendar-note">'+(ev.kind==='proposal'?'这是你提出的安排。':'这是阿尔自己安排的时间。')+'</div><div class="calendar-actions"><button id="ask-join">问他能否一起</button><button id="ask-change">商量调整时间</button><button id="ask-cancel">让他自由安排</button><button id="back-calendar">返回日程</button></div></div>';$('drawer').classList.add('open');
  $('ask-join').onclick=()=>{let yes=ev.kind!=='routine'&&ev.kind!=='personal'&&(s.friend+s.attach-s.bored>12);if(yes){ev.withPlayer=true;s.friend=clamp(s.friend+1);s.attach=clamp(s.attach+1);say('好啊，一起做也不错。')}else say('这件事我想自己完成。不过结束后可以一起待一会儿。');save();render();$('drawer').classList.remove('open');renderCalendarBoard();toast(yes?'阿尔同意一起参加':'阿尔保留了自己的安排')};
  $('ask-change').onclick=()=>{let next=Array.from({length:17},(_,i)=>i+6).find(x=>!eventAt(key,x));if(next===undefined){say('今天没有合适的空档，还是先保持原计划吧。');return}ev.start=next;ev.end=next+1;s.calendar.days[key].sort((a,b)=>a.start-b.start);say('我可以把这件事挪到 '+pad(next)+':00。');save();$('drawer').classList.remove('open');renderCalendarBoard()};
  $('ask-cancel').onclick=()=>{if(ev.kind==='routine'){say('这件事是我的基本生活安排，我不打算取消。');return}s.calendar.days[key]=s.calendar.days[key].filter(x=>x!==ev);save();$('drawer').classList.remove('open');renderCalendarBoard();say('好，这段时间我自己决定。')};
  $('back-calendar').onclick=()=>{$('drawer').classList.remove('open');renderCalendarBoard()};return;
 }
 $('drawerTitle').textContent='提出安排 · '+dayLabel(d)+' '+pad(h)+':00';
 $('choices').innerHTML='<div class="calendar-panel"><div class="calendar-note">邀请阿尔在 '+pad(h)+':00 开始留出一小时。你想和他做什么？</div><div class="choices">'+[['一起吃点东西','🥐'],['散步','🌿'],['听音乐','♫'],['一起看书','📖'],['玩游戏','🎲'],['自由相处','☁']].map((x,i)=>'<button class="choice" data-propose="'+i+'"><span class="emoji">'+x[1]+'</span>'+x[0]+'</button>').join('')+'</div><div class="calendar-actions"><button id="back-calendar">返回日程</button></div></div>';$('drawer').classList.add('open');
 $('choices').querySelectorAll('[data-propose]').forEach(b=>b.onclick=()=>{let i=+b.dataset.propose,names=['一起吃点东西','散步','听音乐','一起看书','玩游戏','自由相处'],prefs=['food','walk','music','reading','game','company'],pref=s.preferences?.[prefs[i]]||0,need=(i===0&&s.hunger<35)||(i===1&&s.fun<35)||(i===2&&s.fun<40),score=s.friend*.35+s.attach*.35-s.bored*.4+(s.energy-50)*.15+pref*3+(need?12:0),yes=score>15;
  if(yes){s.calendar.days[key].push({start:h,end:h+1,title:names[i],kind:'proposal',byPlayer:true});s.calendar.days[key].sort((a,b)=>a.start-b.start);say('可以，我把这段时间留出来。');s.friend=clamp(s.friend+1);s.attach=clamp(s.attach+1);toast('阿尔接受了你的提议')}
  else{say('这个时间我不太想这样安排。要不换个时间？我也有自己的打算。');s.bored=clamp(s.bored+1);toast('阿尔没有接受这次邀请')}
  save();render();$('drawer').classList.remove('open');renderCalendarBoard();
 });
 $('back-calendar').onclick=()=>{$('drawer').classList.remove('open');renderCalendarBoard()};
}
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>openTab(b.dataset.tab)));
$('closeDrawer').onclick=()=>$('drawer').classList.remove('open');$('backRoom').onclick=closeCalendar;$('backRoom').onclick=closeCalendar;
$('chatForm').addEventListener('submit',e=>{e.preventDefault();let v=$('message').value.trim();if(!v)return;s.friend=clamp(s.friend+1);s.fun=clamp(s.fun+2);s.bored=clamp(s.bored-1);let lines=['我听到了。你接着说。','这个问题我有自己的想法。','嗯？这部分可以再讲具体一点。','我先记下这件事。','你今天想聊的内容还真不少。'];say(lines[Math.floor(Math.random()*lines.length)]);$('message').value='';save();render()});
let decorating=false;
$('decorate').onclick=()=>{decorating=!decorating;$('stage').classList.toggle('editing',decorating);$('decorate').textContent=decorating?'完成装修':'✦ 装修';if(decorating){$('drawer').classList.remove('open');say('点选房间里的物件，看看可以怎样调整。')}else say('好了，房间暂时这样。')};
document.querySelectorAll('.hotspot').forEach(b=>b.addEventListener('click',()=>{let obj=b.dataset.object;if(!decorating){say('你看了看'+obj+'。要不要试试装修？');return}let opts=obj==='沙发'?['鼠尾草绿','暖杏色','砖红色']:obj==='窗户'?['打开窗帘','合上窗帘','换一幅窗景']:['摆上花瓶','放一本书','点亮台灯'];$('drawerTitle').textContent='调整 · '+obj;$('choices').innerHTML='';opts.forEach((o,i)=>{let x=document.createElement('button');x.className='choice';x.textContent=o;x.onclick=()=>{if(obj==='沙发')document.querySelector('.sofa').style.background=['#819477','#d9a77d','#b96e5c'][i];if(obj==='窗户')document.querySelector('.window').style.background=['linear-gradient(145deg,#b9d0c0,#f2d9a9)','linear-gradient(145deg,#9c9a91,#c9bba7)','linear-gradient(145deg,#c0d4dd,#f4d5a8)'][i];if(obj==='茶几')say(o+'。');else say(obj+'有了新的样子。');$('drawer').classList.remove('open')};$('choices').appendChild(x)});$('drawer').classList.add('open')}));
offline();s.visits++;ensureSchedule();save();render();clock();renderCalendarBoard();setInterval(()=>{clock();let before=s.calendar?.anchor;ensureSchedule();if(s.calendar?.anchor!==before){renderCalendarBoard();say('早上六点了。我重新安排了今天的时间。')}},15000);
if(s.visits===1)say(new Date().getHours()<10?'早。今天有什么安排？':'你来了。我刚好有空。');
})();
</script>
